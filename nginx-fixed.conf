# HTTPS: прокси в Next.js и API
server {
    listen 10.1.1.215:443 ssl;
    http2 on;

    server_name logistgo.pro www.logistgo.pro;

    # Сертификаты LE
    ssl_certificate     /etc/letsencrypt/live/logistgo.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logistgo.pro/privkey.pem;   # managed by Certbot

    # Отключим ModSecurity только тут
    modsecurity off;

    # WebSocket соединения (должно быть ПЕРЕД /api/)
    location /notifications {
        proxy_pass         http://127.0.0.1:5555/notifications;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;  # 24 hours
        proxy_send_timeout 86400;  # 24 hours
        proxy_connect_timeout 10s;
    }

    # API запросы проксируем на бэкенд (порт 5555, НЕ 8080!)
    location /api/ {
        proxy_pass         http://127.0.0.1:5555/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Для CORS
        proxy_set_header   Origin            $scheme://$host;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Все остальные запросы проксируем на фронтенд (порт 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 120s;
    }
}
