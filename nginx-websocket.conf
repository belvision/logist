# WebSocket конфигурация для Nginx
# Добавить в основной nginx.conf в блок http

limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=ws_req:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=100r/m;

server {
    listen 10.1.1.215:443 ssl;
    http2 on;
    server_name logistgo.pro www.logistgo.pro;

    ssl_certificate     /etc/letsencrypt/live/logistgo.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistgo.pro/privkey.pem;

    modsecurity off;

    # WebSocket соединения (должно быть ПЕРЕД /api/)
    location /notifications {
        limit_conn ws_conn 5;
        limit_req zone=ws_req burst=5 nodelay;
        
        proxy_pass         http://127.0.0.1:5555/notifications;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 10s;
        
        # Отключаем буферизацию для WebSocket
        proxy_buffering off;
        proxy_cache off;
    }

    # API запросы проксируем на бэкенд
    location /api/ {
        limit_req zone=api_req burst=20 nodelay;
        
        proxy_pass         http://127.0.0.1:5555/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Для CORS
        proxy_set_header   Origin            $scheme://$host;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Все остальные запросы проксируем на фронтенд
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 120s;
    }
}

server {
    listen 10.1.1.215:80;
    server_name logistgo.pro www.logistgo.pro;
    return 301 https://$server_name$request_uri;
}
