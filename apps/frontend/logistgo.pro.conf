limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone $binary_remote_addr zone=ws_req:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=100r/m;

server {
    listen 10.1.1.215:443 ssl;
    http2 on;
    server_name logistgo.pro www.logistgo.pro;
    
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    ssl_certificate     /etc/letsencrypt/live/logistgo.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistgo.pro/privkey.pem;

    modsecurity off;

    location /notifications {
        limit_conn ws_conn 5;
        limit_req zone=ws_req burst=5 nodelay;
        
        proxy_pass              http://127.0.0.1:5555/notifications;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        X-Forwarded-Port  $server_port;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
        proxy_connect_timeout   10s;
        proxy_buffering         off;
        proxy_set_header        Cache-Control     "no-cache";
        proxy_set_header        Pragma            "no-cache";
        proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 5s;
        proxy_set_header        Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header        Sec-WebSocket-Version   $http_sec_websocket_version;
        proxy_set_header        Sec-WebSocket-Key       $http_sec_websocket_key;
        proxy_set_header        Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_intercept_errors  on;
        error_page 502 503 504 = @websocket_fallback;
    }

    location @websocket_fallback {
        add_header Content-Type application/json;
        return 503 '{"error": "WebSocket service temporarily unavailable", "code": "WEBSOCKET_UNAVAILABLE"}';
    }

    location /api/ {
        limit_req zone=api_req burst=20 nodelay;
        
        proxy_pass         http://127.0.0.1:5555/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Origin            $scheme://$host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

server {
    listen 10.1.1.215:80;
    server_name logistgo.pro www.logistgo.pro;
    return 301 https://$server_name$request_uri;
}
